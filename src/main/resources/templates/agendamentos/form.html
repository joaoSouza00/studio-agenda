<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${agendamentoId == null} ? 'Novo agendamento' : 'Editar agendamento')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('agendamentos')}"></nav>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-7">
            <h1 class="h3 mb-3" th:text="${agendamentoId == null} ? 'Novo agendamento' : 'Editar agendamento'">Agendamento</h1>
            <div th:replace="~{fragments/layout :: mensagens}"></div>
            <div class="card">
                <div class="card-body p-4">
                    <form th:action="${agendamentoId == null} ? @{/agendamentos} : @{/agendamentos/{id}(id=${agendamentoId})}" th:object="${agendamento}" method="post" novalidate>
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label" for="clienteId">Cliente</label>
                                <select class="form-select" th:errorclass="is-invalid" id="clienteId" th:field="*{clienteId}">
                                    <option value="">Selecione o cliente</option>
                                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="profissionalId">Profissional</label>
                                <select class="form-select" th:errorclass="is-invalid" id="profissionalId" th:field="*{profissionalId}">
                                    <option value="">Selecione o profissional</option>
                                    <option th:each="profissional : ${profissionais}" th:value="${profissional.id}" th:text="${profissional.nome} + ' (' + ${profissional.especialidade} + ')'"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('profissionalId')}" th:errors="*{profissionalId}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Serviços</label>
                            <div class="border rounded p-3 lista-servicos" th:classappend="${#fields.hasErrors('servicoIds')} ? 'border-danger'">
                                <p class="text-muted mb-0" th:if="${#lists.isEmpty(servicos)}">Nenhum serviço cadastrado. <a th:href="@{/servicos/novo}">Cadastre um serviço</a>.</p>
                                <div class="form-check" th:each="servico : ${servicos}">
                                    <input type="checkbox" class="form-check-input" th:field="*{servicoIds}" th:value="${servico.id}">
                                    <label class="form-check-label" th:for="${#ids.prev('servicoIds')}"
                                           th:text="${servico.nome} + ' (' + ${servico.duracaoMinutos} + ' min, R$ ' + ${#numbers.formatDecimal(servico.preco, 1, 'POINT', 2, 'COMMA')} + ')'"></label>
                                </div>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('servicoIds')}" th:errors="*{servicoIds}"></div>
                            <div class="form-text">A duração e o valor total são calculados a partir dos serviços escolhidos.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="dataHoraInicio">Data e hora de início</label>
                            <input type="datetime-local" class="form-control" th:errorclass="is-invalid" id="dataHoraInicio" th:field="*{dataHoraInicio}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dataHoraInicio')}" th:errors="*{dataHoraInicio}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/agendamentos}">Voltar</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
