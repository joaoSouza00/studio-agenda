<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Agendamentos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Agendamentos</h1>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <a class="botao" th:href="@{/agendamentos/novo}">Novo agendamento</a>
    <p th:if="${#lists.isEmpty(agendamentos)}">Nenhum agendamento cadastrado.</p>
    <table th:unless="${#lists.isEmpty(agendamentos)}">
        <thead>
        <tr>
            <th>Data e hora</th>
            <th>Cliente</th>
            <th>Profissional</th>
            <th>Serviços</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="agendamento : ${agendamentos}">
            <td>
                <span th:text="${#temporals.format(agendamento.dataHoraInicio, 'dd/MM/yyyy HH:mm')}"></span>
                <span class="detalhe" th:text="'até ' + ${#temporals.format(agendamento.dataHoraFim, 'HH:mm')} + ' (' + ${agendamento.duracaoTotalMinutos} + ' min)'"></span>
            </td>
            <td th:text="${agendamento.clienteNome}"></td>
            <td th:text="${agendamento.profissionalNome}"></td>
            <td th:text="${#strings.listJoin(agendamento.servicos.![nome], ', ')}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(agendamento.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
            <td><span class="status" th:classappend="'status-' + ${#strings.toLowerCase(agendamento.status)}" th:text="${agendamento.status}"></span></td>
            <td class="acoes">
                <th:block th:if="${agendamento.status.name() == 'AGENDADO'}">
                    <a class="botao" th:href="@{/agendamentos/{id}/editar(id=${agendamento.id})}">Editar</a>
                    <form class="inline" th:action="@{/agendamentos/{id}/concluir(id=${agendamento.id})}" method="post">
                        <button type="submit" class="botao-sucesso">Concluir</button>
                    </form>
                    <form class="inline" th:action="@{/agendamentos/{id}/cancelar(id=${agendamento.id})}" method="post">
                        <button type="submit" class="botao-perigo">Cancelar</button>
                    </form>
                </th:block>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
