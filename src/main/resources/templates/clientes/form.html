<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${clienteId == null} ? 'Novo cliente' : 'Editar cliente')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('clientes')}"></nav>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-6">
            <h1 class="h3 mb-3" th:text="${clienteId == null} ? 'Novo cliente' : 'Editar cliente'">Cliente</h1>
            <div class="card">
                <div class="card-body p-4">
                    <form th:action="${clienteId == null} ? @{/clientes} : @{/clientes/{id}(id=${clienteId})}" th:object="${cliente}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="nome">Nome</label>
                            <input type="text" class="form-control" th:errorclass="is-invalid" id="nome" th:field="*{nome}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="telefone">Telefone</label>
                            <input type="tel" class="form-control" th:errorclass="is-invalid" id="telefone" th:field="*{telefone}" placeholder="(11) 99999-0000">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="email">E-mail <span class="text-muted small">(opcional)</span></label>
                            <input type="email" class="form-control" th:errorclass="is-invalid" id="email" th:field="*{email}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
