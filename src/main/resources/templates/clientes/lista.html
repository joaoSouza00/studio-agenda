<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('clientes')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Clientes</h1>
        <a class="btn btn-primary" th:href="@{/clientes/novo}"><i class="bi bi-plus-lg me-1"></i>Novo cliente</a>
    </div>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <div class="card">
        <div class="card-body text-center text-muted py-5" th:if="${#lists.isEmpty(clientes)}">
            <i class="bi bi-people fs-1 d-block mb-2"></i>
            Nenhum cliente cadastrado.
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(clientes)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td class="fw-semibold" th:text="${cliente.nome}"></td>
                    <td th:text="${cliente.telefone}"></td>
                    <td th:text="${#strings.isEmpty(cliente.email)} ? '—' : ${cliente.email}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/{id}/editar(id=${cliente.id})}"><i class="bi bi-pencil me-1"></i>Editar</a>
                        <form class="d-inline" th:action="@{/clientes/{id}/excluir(id=${cliente.id})}" method="post"
                              onsubmit="return confirm('Deseja excluir este cliente?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
