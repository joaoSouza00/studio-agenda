<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Clientes</h1>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <a class="botao" th:href="@{/clientes/novo}">Novo cliente</a>
    <p th:if="${#lists.isEmpty(clientes)}">Nenhum cliente cadastrado.</p>
    <table th:unless="${#lists.isEmpty(clientes)}">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.nome}"></td>
            <td th:text="${cliente.telefone}"></td>
            <td th:text="${cliente.email}"></td>
            <td class="acoes">
                <a class="botao" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
                <form class="inline" th:action="@{/clientes/{id}/excluir(id=${cliente.id})}" method="post">
                    <button type="submit" class="botao-perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
