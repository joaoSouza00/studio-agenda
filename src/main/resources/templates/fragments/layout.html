<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | StudioAgenda'">StudioAgenda</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --studio-roxo: #5b2a86;
            --studio-roxo-escuro: #46206a;
            --studio-roxo-claro: #f1eaf7;
        }
        body { background: #f5f5f8; min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; width: 100%; max-width: 1140px; }
        .navbar-studio { background: var(--studio-roxo); }
        .navbar-studio .nav-link { color: rgba(255, 255, 255, .8); }
        .navbar-studio .nav-link:hover, .navbar-studio .nav-link.active { color: #fff; }
        .navbar-studio .nav-link.active { font-weight: 600; }
        .btn-primary {
            --bs-btn-bg: var(--studio-roxo);
            --bs-btn-border-color: var(--studio-roxo);
            --bs-btn-hover-bg: var(--studio-roxo-escuro);
            --bs-btn-hover-border-color: var(--studio-roxo-escuro);
            --bs-btn-active-bg: var(--studio-roxo-escuro);
            --bs-btn-active-border-color: var(--studio-roxo-escuro);
        }
        .btn-outline-primary {
            --bs-btn-color: var(--studio-roxo);
            --bs-btn-border-color: var(--studio-roxo);
            --bs-btn-hover-bg: var(--studio-roxo);
            --bs-btn-hover-border-color: var(--studio-roxo);
            --bs-btn-active-bg: var(--studio-roxo-escuro);
            --bs-btn-active-border-color: var(--studio-roxo-escuro);
        }
        .text-studio { color: var(--studio-roxo); }
        .text-bg-primary { background-color: var(--studio-roxo) !important; }
        .bg-studio-claro { background: var(--studio-roxo-claro); }
        .form-control:focus, .form-select:focus, .form-check-input:focus {
            border-color: var(--studio-roxo);
            box-shadow: 0 0 0 .2rem rgba(91, 42, 134, .2);
        }
        .form-check-input:checked { background-color: var(--studio-roxo); border-color: var(--studio-roxo); }
        .card { border: 0; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
        .table > :not(caption) > * > * { padding: .75rem 1rem; }
        .atalho { transition: transform .15s, box-shadow .15s; }
        .atalho:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, .1); }
        .lista-servicos { max-height: 260px; overflow-y: auto; }
    </style>
</head>
<body>
<nav th:fragment="nav(ativo)" class="navbar navbar-expand-md navbar-dark navbar-studio shadow-sm">
    <div class="container" style="max-width: 1140px">
        <a class="navbar-brand fw-semibold" th:href="@{/}"><i class="bi bi-scissors me-1"></i>StudioAgenda</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${ativo == 'agendamentos'} ? 'active'" th:href="@{/agendamentos}"><i class="bi bi-calendar-check me-1"></i>Agendamentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${ativo == 'clientes'} ? 'active'" th:href="@{/clientes}"><i class="bi bi-people me-1"></i>Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${ativo == 'profissionais'} ? 'active'" th:href="@{/profissionais}"><i class="bi bi-person-badge me-1"></i>Profissionais</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${ativo == 'servicos'} ? 'active'" th:href="@{/servicos}"><i class="bi bi-tags me-1"></i>Serviços</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div th:fragment="mensagens">
    <div class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert" th:if="${sucesso}">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert" th:if="${erro}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</div>
<footer th:fragment="rodape" class="text-center text-muted small py-3">
    StudioAgenda &middot; Sistema de agendamento para salões de beleza
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
