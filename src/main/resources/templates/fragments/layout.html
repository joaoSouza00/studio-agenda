<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | StudioAgenda'">StudioAgenda</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f6f6f8; color: #222; }
        nav { background: #5b2a86; padding: 12px 24px; }
        nav a { color: #fff; margin-right: 20px; text-decoration: none; font-weight: 600; }
        main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        form.inline { display: inline; }
        label { display: block; margin-top: 12px; font-weight: 600; }
        input { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button, .botao { display: inline-block; margin-top: 16px; padding: 8px 16px; background: #5b2a86; color: #fff; border: none; border-radius: 4px; text-decoration: none; cursor: pointer; }
        .botao-secundario { background: #888; }
        .botao-perigo { background: #c0392b; margin-top: 0; }
        .acoes a, .acoes button { margin-top: 0; padding: 4px 10px; font-size: 14px; }
        .erro-campo { color: #c0392b; font-size: 14px; }
        .alerta { padding: 12px; border-radius: 4px; margin-bottom: 16px; }
        .alerta-sucesso { background: #d4edda; color: #155724; }
        .alerta-erro { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<nav th:fragment="nav">
    <a th:href="@{/}">StudioAgenda</a>
    <a th:href="@{/clientes}">Clientes</a>
    <a th:href="@{/profissionais}">Profissionais</a>
    <a th:href="@{/servicos}">Serviços</a>
</nav>
<div th:fragment="mensagens">
    <div class="alerta alerta-sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alerta alerta-erro" th:if="${erro}" th:text="${erro}"></div>
</div>
</body>
</html>
