<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Profissionais')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('profissionais')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Profissionais</h1>
        <a class="btn btn-primary" th:href="@{/profissionais/novo}"><i class="bi bi-plus-lg me-1"></i>Novo profissional</a>
    </div>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <div class="card">
        <div class="card-body text-center text-muted py-5" th:if="${#lists.isEmpty(profissionais)}">
            <i class="bi bi-person-badge fs-1 d-block mb-2"></i>
            Nenhum profissional cadastrado.
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(profissionais)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>Especialidade</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="profissional : ${profissionais}">
                    <td class="fw-semibold" th:text="${profissional.nome}"></td>
                    <td th:text="${profissional.especialidade}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/profissionais/{id}/editar(id=${profissional.id})}"><i class="bi bi-pencil me-1"></i>Editar</a>
                        <form class="d-inline" th:action="@{/profissionais/{id}/excluir(id=${profissional.id})}" method="post"
                              onsubmit="return confirm('Deseja excluir este profissional?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
