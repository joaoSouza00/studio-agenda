<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${servicoId == null} ? 'Novo serviço' : 'Editar serviço')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1 th:text="${servicoId == null} ? 'Novo serviço' : 'Editar serviço'">Serviço</h1>
    <form th:action="${servicoId == null} ? @{/servicos} : @{/servicos/{id}(id=${servicoId})}" th:object="${servico}" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}">
        <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>

        <label for="duracaoMinutos">Duração (minutos)</label>
        <input type="number" id="duracaoMinutos" min="1" th:field="*{duracaoMinutos}">
        <div class="erro-campo" th:if="${#fields.hasErrors('duracaoMinutos')}" th:errors="*{duracaoMinutos}"></div>

        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" min="0" step="0.01" th:field="*{preco}">
        <div class="erro-campo" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></div>

        <button type="submit">Salvar</button>
        <a class="botao botao-secundario" th:href="@{/servicos}">Cancelar</a>
    </form>
</main>
</body>
</html>
