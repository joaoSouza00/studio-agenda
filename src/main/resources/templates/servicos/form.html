<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${servicoId == null} ? 'Novo serviço' : 'Editar serviço')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('servicos')}"></nav>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-6">
            <h1 class="h3 mb-3" th:text="${servicoId == null} ? 'Novo serviço' : 'Editar serviço'">Serviço</h1>
            <div class="card">
                <div class="card-body p-4">
                    <form th:action="${servicoId == null} ? @{/servicos} : @{/servicos/{id}(id=${servicoId})}" th:object="${servico}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="nome">Nome</label>
                            <input type="text" class="form-control" th:errorclass="is-invalid" id="nome" th:field="*{nome}" placeholder="Ex.: Corte feminino">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label" for="duracaoMinutos">Duração</label>
                                <div class="input-group has-validation">
                                    <input type="number" class="form-control" th:errorclass="is-invalid" id="duracaoMinutos" min="1" th:field="*{duracaoMinutos}">
                                    <span class="input-group-text">min</span>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('duracaoMinutos')}" th:errors="*{duracaoMinutos}"></div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="preco">Preço</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" class="form-control" th:errorclass="is-invalid" id="preco" min="0" step="0.01" th:field="*{preco}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></div>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/servicos}">Cancelar</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
