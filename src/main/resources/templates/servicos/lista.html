<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Serviços')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Serviços</h1>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <a class="botao" th:href="@{/servicos/novo}">Novo serviço</a>
    <p th:if="${#lists.isEmpty(servicos)}">Nenhum serviço cadastrado.</p>
    <table th:unless="${#lists.isEmpty(servicos)}">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Duração</th>
            <th>Preço</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="servico : ${servicos}">
            <td th:text="${servico.nome}"></td>
            <td th:text="${servico.duracaoMinutos} + ' min'"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(servico.preco, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="acoes">
                <a class="botao" th:href="@{/servicos/{id}/editar(id=${servico.id})}">Editar</a>
                <form class="inline" th:action="@{/servicos/{id}/excluir(id=${servico.id})}" method="post">
                    <button type="submit" class="botao-perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
