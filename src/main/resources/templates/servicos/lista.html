<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Serviços')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('servicos')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Serviços</h1>
        <a class="btn btn-primary" th:href="@{/servicos/novo}"><i class="bi bi-plus-lg me-1"></i>Novo serviço</a>
    </div>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <div class="card">
        <div class="card-body text-center text-muted py-5" th:if="${#lists.isEmpty(servicos)}">
            <i class="bi bi-tags fs-1 d-block mb-2"></i>
            Nenhum serviço cadastrado.
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(servicos)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>Duração</th>
                    <th>Preço</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="servico : ${servicos}">
                    <td class="fw-semibold" th:text="${servico.nome}"></td>
                    <td><i class="bi bi-clock text-muted me-1"></i><span th:text="${servico.duracaoMinutos} + ' min'"></span></td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(servico.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/servicos/{id}/editar(id=${servico.id})}"><i class="bi bi-pencil me-1"></i>Editar</a>
                        <form class="d-inline" th:action="@{/servicos/{id}/excluir(id=${servico.id})}" method="post"
                              onsubmit="return confirm('Deseja excluir este serviço?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
